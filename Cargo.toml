cargo-features = ["profile-rustflags"]

[package]
name = "moonwalk"
version = "0.1.0"
edition = "2024"

# Reduce binary size
[profile.release]
opt-level = 3
codegen-units = 1
debug-assertions = false
lto = true
overflow-checks = false
# panic = "abort"
debug = true
split-debuginfo = "packed"
rustflags = [
  # "-Zno-jump-tables",
  "-Ctarget-feature=+fma",
  "-Ctarget-feature=+avx",
  "-Ctarget-feature=+avx2",
  "-Ccontrol-flow-guard=off",
  # "-Cforce-frame-pointers=off",
  # "-Cforce-unwind-tables=on",
  # "-Cno-redzone=on"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.dev]
opt-level = 1
# panic = "abort"
debug-assertions = false
debug = true
strip = "none"
split-debuginfo = "packed"
rustflags = [
  "-Ctarget-feature=+fma",
  "-Ctarget-feature=+avx",
  "-Ctarget-feature=+avx2",
  "-Ccontrol-flow-guard=off",
  "-Cforce-frame-pointers=off",
  "-Cforce-unwind-tables=on",
  "-Cno-redzone=on"
]

[dependencies]
xgadget = "0.11.1"
memflow = "0.2.3"
pdb = "0.8.0"
thiserror = { version = "2.0.12", default-features = false }
pe-parser = { version = "0.7.0", default-features = false }
static_assertions = "1.1.0"
bitreader = { version = "0.3.11", default-features = false }
iced-x86 = { version = "1.21.0", features = ["code_asm"] }
rayon = "1.10.0"
rand = "0.9.1"
